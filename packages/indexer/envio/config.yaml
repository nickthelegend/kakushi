# Generated from current deployment files; rerun after every local redeploy.
name: kakushi-envio
handlers: src/handlers
address_format: lowercase
field_selection:
  transaction_fields: [hash]
contracts:
  - name: SourceRouter
    events:
      - event: "PaymentEncoded(address indexed sender, address indexed maker, address token, uint256 gross, uint16 code, address recipient)"
  - name: PayoutRouter
    events:
      - event: "Payout(bytes32 indexed srcRef, address indexed maker, address indexed recipient, address token, uint256 amount, uint8 kind)"
  - name: DisputeModule
    events:
      - event: "DisputeExpired(bytes32 indexed disputeKey, address indexed maker)"
      - event: "DisputeMakerProven(bytes32 indexed disputeKey, address indexed maker)"
      - event: "DisputeOpened(bytes32 indexed disputeKey, bytes32 indexed srcRef, address indexed maker, address opener, uint64 srcChainId, bytes32 srcTxHash, uint32 logIndex)"
      - event: "DisputeSlashed(bytes32 indexed disputeKey, address indexed maker, address indexed sender, address marginToken, uint256 compensation, uint256 paid, uint256 reward)"
  - name: MDC
    events:
      - event: "MarginDeposited(address indexed maker, address indexed token, uint256 amount, uint256 total)"
      - event: "MarginSlashed(address indexed maker, address indexed token, address indexed to, uint256 requested, uint256 paid, bytes32 disputeKey)"
      - event: "MarginWithdrawn(address indexed maker, address indexed token, uint256 amount, uint256 remaining)"
  - name: AttestationOracle
    events:
      - event: "WindowAttested(uint256 indexed id, uint64 indexed chainId, uint8 indexed kind, uint64 fromBlock, uint64 toBlock, uint64 fromTime, uint64 toTime, uint256 root, uint32 leafCount)"
  - name: EBC
    events:
      - event: "PairActiveSet(bytes32 indexed pairId, bool active)"
      - event: "PairRegistered(bytes32 indexed pairId, address indexed maker, uint64 srcChainId, address srcToken, uint64 dstChainId, address dstToken, uint16 identCode)"
  - name: USDC
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
