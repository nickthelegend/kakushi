[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"          # Monad supports Cancun (EIP-1153 transient storage is used by the ACL)
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = ["forge-std/=lib/forge-std/src/", "@kakushi/fhe/=src/"]

[fuzz]
runs = 512

[lint]
lint_on_build = false
