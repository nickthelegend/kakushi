# CRE workflow settings for kakushi-fhe-decrypt-relay (one block per target in ../../project.yaml).
# Config files are generated from contracts/deployments by `pnpm --filter @kakushi/fhe-cre configure`.
local-settings:
  user-workflow:
    workflow-name: "kakushi-fhe-decrypt-relay"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.local.json"
    secrets-path: ""

staging-settings:
  user-workflow:
    workflow-name: "kakushi-fhe-decrypt-relay"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.testnet.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "kakushi-fhe-decrypt-relay"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.testnet.json"
    secrets-path: ""
