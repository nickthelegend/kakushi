          - "0x5c7c905b505f0cf40ab6600d05e677f717916f6b" # cUSDC over USDC
      - name: FhishDecryptionOracle
        address: "0x6a70da54762ff8637b00bbe35d2fe396fbf1cf97"
      - name: FhishExecutor
        address: "0x4488f514d57837771d4b700ab22d4c58cd66cd53"
