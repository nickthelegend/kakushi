name: ci
on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
        env: { FHISH_OFFLINE: "1" }   # live Monad testnet checks run locally, not in CI

  cre-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: install the CRE CLI
        run: |
          curl -sSL https://app.chain.link/cre/install.sh | bash
          echo "$HOME/.cre/bin" >> "$GITHUB_PATH"
      - name: compile fhish-decrypt-relay to WASM
        working-directory: cre
        run: |
          node scripts/configure.ts
          cre workflow build ./workflows/decrypt-relay

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - run: cargo build --release
        working-directory: engine
      - name: keygen + encrypt smoke test (real tfhe-rs)
        working-directory: engine
        run: |
          ./target/release/fhish-engine keygen --dir /tmp/fhish
          ./target/release/fhish-engine encrypt --pk /tmp/fhish/keys/public_key.bin --type 4 --value 1337 | head -c 64

  indexer:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: indexer } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile   # standalone workspace (indexer/pnpm-workspace.yaml)
      - run: pnpm configure                    # config.yaml from contracts/deployments/local*.json
      - run: pnpm codegen
      - run: pnpm typecheck
      - run: pnpm test

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci                            # postinstall inlines node-tfhe into the WebView page
      - run: npm run typecheck
